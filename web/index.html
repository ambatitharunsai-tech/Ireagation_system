<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SmartAgri - Intelligent Farm Management">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SmartAgri">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SmartAgri</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f8f9fa;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(180deg, rgba(15,157,88,0.08) 0%, #ffffff 100%);
    }
    .loading-icon {
      font-size: 64px;
      margin-bottom: 16px;
    }
    .loading-title {
      font-size: 28px;
      font-weight: 700;
      color: #2E7D32;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .loading-subtitle {
      font-size: 14px;
      color: #757575;
      margin-bottom: 32px;
    }
    .loading-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e0e0e0;
      border-top-color: #0F9D58;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading-screen" id="loading">
    <div class="loading-icon">🌱</div>
    <div class="loading-title">SmartAgri</div>
    <div class="loading-subtitle">Loading your farm...</div>
    <div class="loading-spinner"></div>
  </div>

  <script>
    // Remove splash once Flutter renders its first frame
    window.addEventListener('flutter-first-frame', function () {
      const el = document.getElementById('loading');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
