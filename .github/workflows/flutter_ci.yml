name: Flutter CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-26.04
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Prepare local environment asset
        run: touch .env

      - name: Configure stable Android release signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            printf '%s\n' "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            printf '%s\n' "keyPassword=$ANDROID_KEY_PASSWORD"
            printf '%s\n' "keyAlias=$ANDROID_KEY_ALIAS"
            printf '%s\n' "storeFile=app/upload-keystore.jks"
          } > android/key.properties

      - name: Format Code
        run: dart format .

      - name: Analyze Code
        run: dart analyze

      - name: Run Tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release --build-name="1.0.${GITHUB_RUN_NUMBER}" --build-number="${GITHUB_RUN_NUMBER}"

      - name: Upload Android APK
        id: apk-upload
        uses: actions/upload-artifact@v7
        with:
          name: Ireagation-System-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK download link
        if: success()
        run: |
          echo '## Android APK (CI artifact)' >> "$GITHUB_STEP_SUMMARY"
          echo "[Download Ireagation System APK](${{ steps.apk-upload.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: $(shasum -a 256 build/app/outputs/flutter-apk/app-release.apk | cut -d ' ' -f 1)" >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    name: Publish public Android download
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: write
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Explain missing release signing key
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: |
          echo '## Public release not published' >> "$GITHUB_STEP_SUMMARY"
          echo 'Add the four Android signing repository secrets described in README.md, then push a new commit to main to publish an update-safe APK.' >> "$GITHUB_STEP_SUMMARY"

      - name: Download signed APK artifact
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p dist
          gh run download "$GITHUB_RUN_ID" --name "Ireagation-System-Android-APK" --dir dist

      - name: Publish GitHub Release
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="android-v1.0.${GITHUB_RUN_NUMBER}"
          TITLE="Ireagation System Android v1.0.${GITHUB_RUN_NUMBER}"
          NOTES="Public Android release. Includes in-app update checking. Download the APK and confirm installation when Android prompts. Version 1.0.${GITHUB_RUN_NUMBER}."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/app-release.apk --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --latest
          else
            gh release create "$TAG" dist/app-release.apk --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES" --latest
          fi
          echo '## Public Android download' >> "$GITHUB_STEP_SUMMARY"
          echo "[Download Ireagation System APK]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/latest/download/app-release.apk)" >> "$GITHUB_STEP_SUMMARY"
